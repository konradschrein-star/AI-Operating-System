# ─────────────────────────────────────────────────────────────────────────────
# REVIEWABLE COPY of the live vhost.
#
#   live path:  /etc/nginx/sites-enabled/os.schreinercontentsystems.com
#               (a REAL FILE, not a symlink into sites-available — the deploy
#                edits it in place; there is no sites-available twin to update)
#   captured:   2026-08-25, byte-for-byte apart from this header and the ONE
#               addition marked "ADDED …" below.
#
# This file is NOT installed by any build task. `docs/plan/aios-browser-takeover-live/deploy.md`
# is the runbook: it inserts the one location block, runs `nginx -t`, and only
# then reloads. Never reload without `nginx -t` first.
#
# `$connection_upgrade` is mapped globally in
# /etc/nginx/conf.d/00-gzip-and-upgrade.conf:30 (`map $http_upgrade …`). Do NOT
# redefine it here — a duplicate `map` at http scope is a hard config error.
# ─────────────────────────────────────────────────────────────────────────────

# forge AI OS console — single-user, auth-gated
server {
    server_name os.schreinercontentsystems.com;

    # Let's Encrypt ACME challenge (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static assets: serve directly from the Next.js build
    location /_next/static/ {
        alias /opt/forge-ai-os/forge-control-web/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # ADDED — browser-takeover WebSocket hop. THE ONLY ADDITION TO THIS FILE.
    #
    # !!  THIS PREFIX BYPASSES NEXTAUTH.  !!
    #
    # Everything else on this host is authenticated by NextAuth middleware
    # running inside the Next process on :7701 (middleware.ts protects every
    # path except /api/auth/*, /signin, /favicon.ico and /_next/*). This
    # location does not go to :7701 at all — it goes straight to forge-control
    # on :7700 — so NO SESSION COOKIE IS EVER CHECKED FOR IT.
    #
    # It has to bypass Next, and the reason is structural, not lazy: a Next
    # Route Handler cannot host a WebSocket (it has no socket access and
    # `Response` rejects 101), so the existing /api/proxy/[...path] handler
    # answers any `Connection: Upgrade` request with 502 + `x-proxy-bailout:
    # upgrade`. Routing the upgrade through Next is not a thing that can be
    # made to work; this location is the fix.
    #
    # THE ONLY PROTECTION ON THIS ROUTE IS THE SIGNED TICKET, verified on :7700
    # by forge-control/src/lib/takeover-ticket.ts before a single byte is
    # proxied. The ticket is HMAC-SHA256 signed, expires in 120 s, is bound to
    # run id + profile + loopback port, and is single-use (its jti is burnt on
    # first presentation). A bare run id is accepted nowhere.
    #
    # CONSEQUENCE, AND IT IS NOT OPTIONAL: forge-control mounts exactly ONE
    # handler under this prefix — the ticket-verifying upgrade listener.
    # NOTHING ELSE MAY EVER BE MOUNTED UNDER /api/browser-takeover/.
    # Any new path here is a public, unauthenticated path into a Chrome holding
    # Konrad's logged-in Google and Perplexity sessions.
    # scripts/checks/check-browser-takeover-ticket.ts gates that invariant; if
    # you are here to add a sibling route, add it somewhere else.
    #
    # `access_log off` is DELIBERATE and load-bearing: the ticket is a BEARER
    # CREDENTIAL and it rides in the URI path segment (noVNC rebuilds its socket
    # URL from its frozen `path` setting and drops query parameters, so there is
    # nowhere else to put it). Logging the request line would write live
    # credentials into /var/log/nginx/access.log, which is world-readable-ish,
    # rotated, and backed up. forge-control logs one line per upgrade attempt
    # instead — run id, profile, port, jti, outcome — and never the ticket.
    #
    # The 3600 s timeouts are the session length: Konrad is typing a password
    # into a real browser by hand, which is quiet for long stretches. The
    # upgrade itself is authorised once, at handshake time.
    # ══════════════════════════════════════════════════════════════════════════
    location /api/browser-takeover/ws/ {
        proxy_pass http://127.0.0.1:7700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    # Everything else → forge-control-web (Next.js, port 7701)
    # Includes /api/auth/* (NextAuth) and /api/proxy/* (forge-control fan-out)
    location / {
        proxy_pass http://127.0.0.1:7701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        client_max_body_size 32M;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/os.schreinercontentsystems.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/os.schreinercontentsystems.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = os.schreinercontentsystems.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name os.schreinercontentsystems.com;

    listen 80;
    return 404; # managed by Certbot


}
